<header class="encabezado">
  <span class="chip">
    <mat-icon aria-hidden="true">{{ estilo().icono }}</mat-icon>
    {{ estilo().etiqueta }}
  </span>
  <button mat-icon-button type="button" class="cerrar-x" aria-label="Cerrar" (click)="cerrar()">
    <mat-icon>close</mat-icon>
  </button>
</header>

<h2 mat-dialog-title [id]="'noticia-' + noticia.id + '-titulo'">{{ noticia.titulo }}</h2>

<mat-dialog-content>
  <p class="meta">
    <mat-icon aria-hidden="true">calendar_today</mat-icon>
    <time [attr.datetime]="noticia.fechaPublicacion">{{ fecha | date: 'fullDate' }}</time>
  </p>

  <!--
    Video de YouTube (normal o Short): reproductor incrustado.
    "autoplay" en allow delega el permiso de reproducción automática: el clic en "Ver" cuenta como interacción.
    Se carga de inmediato (sin loading="lazy") para que empiece al abrirse el modal.
  -->
  @if (video && urlVideo) {
    <div class="marco-video" [class.vertical]="video.vertical">
      <iframe
        [src]="urlVideo"
        [title]="'Video: ' + noticia.titulo"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="autoplay; accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
      ></iframe>
    </div>
  }

  <!-- La imagen solo aparece si la noticia tiene imagenUrl y el enlace carga una imagen real. -->
  @if (mostrarImagen()) {
    <figure class="marco-imagen" [class.cargando]="estadoImagen() === 'cargando'">
      <img
        class="imagen"
        [src]="urlImagen"
        [alt]="noticia.titulo"
        referrerpolicy="no-referrer"
        (load)="estadoImagen.set('cargada')"
        (error)="estadoImagen.set('error')"
      />
    </figure>
  }

  <p class="resumen">{{ noticia.resumen }}</p>

  @for (parrafo of parrafos; track $index) {
    <p>{{ parrafo }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-flat-button class="boton-azul" type="button" (click)="cerrar()">
    {{ data.textoCerrar ?? 'Cerrar' }}
  </button>
</mat-dialog-actions>
